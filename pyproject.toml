[project]
name = "freeswitch"
version = "0.0.1"
requires-python = ">=3.10,<3.11"

dependencies = [
    "pydub>=0.25.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "greenswitch>=0.0.19",
    "websockets>=15.0.1",
    "pyaudio>=0.2.14",
    "librosa>=0.11.0",
    "numpy>=2.2.6",
    "edge-tts>=7.2.3",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "mypy>=1.11.0,<1.15.0",
    "pip>=25.1.1",
    "ruff~=0.12.3",
    "pre-commit>=3.7.0",
]


[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
